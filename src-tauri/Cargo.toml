[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

[package]
name = "lifexp"
version = "0.1.0"
description = "LifeXP - offline habit tracking, notes and journaling with XP"
authors = ["yusha"]
edition = "2021"

[lib]
name = "lifexp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
